<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Colores de la Distopía - Mosaico Interactivo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0a0a0c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        .contenedor-obra {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border: 1px solid #1a1a24;
            transition: opacity 0.5s ease-in-out;
        }
    </style>
</head>
<body>

    <div class="contenedor-obra">
        <img id="mosaico" src="resultado.jpg" alt="Mosaico de pez">
    </div>

    <script>
        // Truco para burlar la caché del navegador y actualizar la imagen automáticamente
        function actualizarMosaico() {
            const imagen = document.getElementById('mosaico');
            // Agregamos una estampa de tiempo (?t=123456) para obligar al navegador a recargar la foto real
            const rutaLimpia = imagen.src.split('?')[0];
            imagen.src = rutaLimpia + '?t=' + new Date().getTime();
            console.log("Mosaico web actualizado con los nuevos datos.");
        }

        // Cada 10 segundos, el navegador revisa discretamente si la imagen cambió en la carpeta
        setInterval(actualizarMosaico, 10000);
    </script>
</body>
</html>
