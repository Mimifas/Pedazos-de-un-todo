<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedazos de un todo</title>
  <style>
    body {
      margin: 0;
      background-color: #0e0e0e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>

  <!-- La imagen se carga dinámicamente para evitar el almacenamiento en caché del navegador -->
  <img id="Pedazos de un todo" alt="¿Quién soy hoy?">

  <script>
    const img = document.getElementById('Pedazos de un todo');
    // Forzamos al navegador a solicitar el archivo actualizado añadiendo la fecha/hora actual
    const timestamp = new Date().getTime();
    img.src = 'pedazos-de-un-todo.JPG?v=' + timestamp;
  </script>

</body>
</html>
