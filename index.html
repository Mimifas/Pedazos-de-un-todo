<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedazos de un todo</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0e0e0e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      overflow: hidden;
    }
    
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Texto proporcional a la pantalla y a la imagen */
    .texto-fondo {
      position: absolute;
      /* Se calcula según el ancho de la pantalla para mantener la proporción con la imagen */
      font-size: clamp(1.2rem, 4vw, 3.5rem); 
      font-weight: 300;
      letter-spacing: 0.2vw; /* Espaciado de letras también proporcional */
      color: #888888;
      text-align: center;
      user-select: none;
      z-index: 1;
      width: 80%; /* Asegura que el texto mantenga un ancho alineado al centro */
    }

    img {
      position: relative;
      z-index: 2;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      cursor: zoom-in;
      transition: transform 0.1s ease-out;
      transform-origin: center center;
    }

    img.zoomed {
      cursor: zoom-out;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="texto-fondo">¿Quién soy hoy?</div>
    <img id="Pedazos de un todo" alt="¿Quién soy hoy?">
  </div>

  <script>
    const img = document.getElementById('Pedazos de un todo');
    
    const timestamp = new Date().getTime();
    img.src = 'pedazos-de-un-todo.jpg?v=' + timestamp;

    let scale = 1;
    const minScale = 1;
    const maxScale = 5;

    function setOrigin(e) {
      const rect = img.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      img.style.transformOrigin = `${x}% ${y}%`;
    }

    function updateTransform() {
      img.style.transform = `scale(${scale})`;
      if (scale > 1) {
        img.classList.add('zoomed');
      } else {
        img.classList.remove('zoomed');
        img.style.transformOrigin = 'center center';
      }
    }

    img.addEventListener('click', (e) => {
      if (scale === 1) {
        setOrigin(e);
        scale = 2.5;
      } else {
        scale = 1;
      }
      updateTransform();
    });

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      
      if (e.target === img) {
        setOrigin(e);
      }

      if (e.deltaY < 0) {
        scale = Math.min(scale + 0.25, maxScale);
      } else {
        scale = Math.max(scale - 0.25, minScale);
      }
      
      updateTransform();
    }, { passive: false });
  </script>

</body>
</html>
