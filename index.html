<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedazos de un todo</title>
  <style>
    body {
      margin: 0;
      background-color: #0e0e0e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
      overflow: hidden;
    }
    
    .container {
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      cursor: zoom-in;
      transition: transform 0.1s ease-out;
      transform-origin: center center;
    }

    img.zoomed {
      cursor: zoom-out;
    }
  </style>
</head>
<body>

  <div class="container">
    <img id="Pedazos de un todo" alt="¿Quién soy hoy?">
  </div>

  <script>
    const img = document.getElementById('Pedazos de un todo');
    
    // 1. Carga de imagen anti-caché
    const timestamp = new Date().getTime();
    img.src = 'pedazos-de-un-todo.jpg?v=' + timestamp;

    // 2. Control de Zoom enfocado en el cursor
    let scale = 1;
    const minScale = 1;
    const maxScale = 5;

    // Función para actualizar el punto focal (transform-origin) según el cursor
    function setOrigin(e) {
      const rect = img.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      img.style.transformOrigin = `${x}% ${y}%`;
    }

    function updateTransform() {
      img.style.transform = `scale(${scale})`;
      if (scale > 1) {
        img.classList.add('zoomed');
      } else {
        img.classList.remove('zoomed');
        // Si regresa al tamaño normal, reorientamos al centro
        img.style.transformOrigin = 'center center';
      }
    }

    // Zoom al hacer Clic en el punto exacto
    img.addEventListener('click', (e) => {
      if (scale === 1) {
        setOrigin(e);
        scale = 2.5;
      } else {
        scale = 1;
      }
      updateTransform();
    });

    // Zoom con Rueda del Mouse hacia la posición del cursor
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      
      // Si el cursor está sobre la imagen, enfocamos el zoom ahí
      if (e.target === img) {
        setOrigin(e);
      }

      if (e.deltaY < 0) {
        scale = Math.min(scale + 0.25, maxScale);
      } else {
        scale = Math.max(scale - 0.25, minScale);
      }
      
      updateTransform();
    }, { passive: false });
  </script>

</body>
</html>
